<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}html{height:100%;overscroll-behavior:none}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}</style>
<title>Liga Kanto TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<style>
/* Layout: mesa de juego de fieltro azul noche; zona rival arriba, jugador abajo, panel lateral con registro. Tema único oscuro deliberado. */
:root {
  --felt: #12233a; --felt2: #0c1828; --ink: #f3ecd8; --muted: #9fb0c6; --line: #2b4362;
  --gold: #f2c230; --gold2: #c9951a; --red: #d8432e; --blue: #3a7bd5; --green: #3fae62; --panel: #172b45; --panel2: #1e3656;
  --f-display: 'Bungee', 'Arial Black', system-ui, sans-serif; --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif; --f-cond: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --cw: clamp(50px, min(5.6vw, 8.4vh), 104px); --ch: calc(var(--cw) * 1.375);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--felt2); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
button { font-family: var(--f-body); font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 8px; padding: 8px 14px; font-size: 14px; }
button:hover:not(:disabled) { border-color: var(--gold); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--gold); color: #1b1503; border-color: var(--gold2); }
button.danger { background: var(--red); border-color: #9e2a1a; }
input, select { font-family: var(--f-body); background: var(--felt2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.disp { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; }
.cond { font-family: var(--f-cond); }
.muted { color: var(--muted); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none !important; }
/* ---- barra superior ---- */
#topbar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: linear-gradient(180deg, #1b3355, #132640); border-bottom: 2px solid var(--gold2); flex-wrap: wrap; }
#topbar .brand { font-family: var(--f-display); color: var(--gold); font-size: 20px; text-shadow: 2px 2px 0 #2a4d8f; }
#topbar nav { display: flex; gap: 6px; flex-wrap: wrap; }
#topbar nav button.on { background: var(--gold); color: #1b1503; }
#topbar .money { margin-left: auto; font-family: var(--f-cond); font-size: 20px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
#badges { display: flex; gap: 3px; }
.badge-slot { width: 28px; height: 28px; border-radius: 50%; background: #0a1422; border: 1px dashed #36507a; display: grid; place-items: center; overflow: hidden; }
.badge-slot img, .badge-slot svg { width: 100%; height: 100%; object-fit: contain; }
.badge-slot.off img, .badge-slot.off svg { filter: grayscale(1) brightness(.35); }
.view { flex: 1; overflow: auto; padding: 16px; padding-block: 16px; }
/* ---- tarjetas ---- */
.card { width: var(--cw); height: calc(var(--cw) * 1.375); border-radius: calc(var(--cw) * .05); background-repeat: no-repeat; background-size: 500% 400%; box-shadow: 0 2px 6px rgba(0,0,0,.5); position: relative; flex: none; }
.card.back { background-image: url(assets/back.webp); background-size: cover; }
/* carta dibujada (sin escaneo) */
.card.drawn { container-type: size; background: #222; overflow: hidden; }
.dc { position: absolute; inset: 3.5cqw; border-radius: 3cqw; display: flex; flex-direction: column; gap: 1.5cqw; padding: 3cqw 3.5cqw; font-family: 'Barlow Condensed', system-ui, sans-serif; color: #1b1b1b; line-height: 1.05;
  --c1: #c9c4b8; --c2: #8f897c; background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: inset 0 0 0 1.2cqw rgba(255,255,255,.35); }
.dc.t-G { --c1: #a6dd7f; --c2: #4f9a3a; } .dc.t-R { --c1: #ffa47c; --c2: #d2482a; } .dc.t-W { --c1: #9fd4ff; --c2: #2f7fcf; } .dc.t-L { --c1: #fff08a; --c2: #e0b10f; }
.dc.t-P { --c1: #d8b0f0; --c2: #8650b4; } .dc.t-F { --c1: #e7b88e; --c2: #a1612f; } .dc.t-C { --c1: #f1ede4; --c2: #b8b1a2; } .dc.t-D { --c1: #6f6c80; --c2: #23222c; color: #f2f2f2; } .dc.t-M { --c1: #eef1f4; --c2: #8d97a3; }
.dc.tr { --c1: #eef2f7; --c2: #b9c4d2; } .dc.dark { box-shadow: inset 0 0 0 1.2cqw rgba(30,10,40,.65); } .dc.light { box-shadow: inset 0 0 0 1.2cqw rgba(255,250,200,.9); }
.dc.shiny { background: linear-gradient(160deg, #fff6c4, var(--c1) 40%, var(--c2)); box-shadow: inset 0 0 0 1.2cqw #f6d55c; }
.dc-top { display: flex; align-items: baseline; gap: 2cqw; font-size: 8.5cqw; }
.dc-st { font-size: 5cqw; font-weight: 700; opacity: .75; }
.dc-nm { flex: 1; font-size: 9.5cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dc-hp { font-size: 7cqw; font-weight: 700; color: #b0141c; } .dc.t-D .dc-hp { color: #ff8a8a; }
.dc-art { flex: 0 0 36%; border-radius: 2cqw; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.8), rgba(255,255,255,.15) 60%), linear-gradient(var(--c2), var(--c1)); display: grid; place-items: center; position: relative; box-shadow: inset 0 0 0 .8cqw rgba(0,0,0,.25); }
.dc-art.en { flex: 1; }
.dc-ico { width: 26cqw; height: 26cqw; background-size: contain; filter: drop-shadow(0 1cqw 1.5cqw rgba(0,0,0,.4)); }
.dc-art.en .dc-ico { width: 52cqw; height: 52cqw; }
.dc-dex { position: absolute; right: 2cqw; bottom: 1cqw; font-size: 5.5cqw; opacity: .6; }
.dc-atk { flex: 1; display: flex; flex-direction: column; gap: 1.5cqw; overflow: hidden; }
.dc-pw { font-size: 6.3cqw; font-weight: 700; color: #a3121b; } .dc.t-D .dc-pw { color: #ffb3b3; }
.dc-a { display: flex; align-items: center; gap: 1.5cqw; font-size: 7cqw; border-top: .4cqw solid rgba(0,0,0,.18); padding-top: 1.2cqw; }
.dc-cost { display: flex; gap: .4cqw; } .dc-cost i { width: 6cqw; height: 6cqw; background-size: contain; display: inline-block; }
.dc-an { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .dc-a b { font-size: 8cqw; }
.dc-txt { flex: 1; font-size: 5.6cqw; line-height: 1.15; overflow: hidden; background: rgba(255,255,255,.55); border-radius: 2cqw; padding: 2cqw; color: #1b1b1b; }
.dc-ft { font-size: 4.8cqw; text-align: right; opacity: .7; }
.symtxt { display: inline-block; font: 700 11px/1 system-ui; background: #2a3a5a; color: #ffd257; border-radius: 4px; padding: 3px 5px; vertical-align: 2px; }
/* selector de región */
.regtabs { display: flex; gap: 6px; margin-bottom: 8px; }
.regtabs button { flex: 1; font-weight: 700; padding: 8px 10px; border-radius: 8px; }
.regtabs button.on { background: var(--gold); color: #1b1300; }
.regtabs button.lock { opacity: .55; }
.regtabs .cnt { font-weight: 500; opacity: .75; }
.card.big { --cw: 300px; }
.holo::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 45%, rgba(120,200,255,.25) 52%, transparent 65%); background-size: 250% 250%; mix-blend-mode: screen; animation: shine 3.2s linear infinite; pointer-events: none; }
@keyframes shine { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.rar { position: absolute; right: 3px; bottom: 3px; font: 700 10px var(--f-cond); padding: 1px 4px; border-radius: 4px; background: rgba(0,0,0,.7); }
.cnt { position: absolute; left: 3px; top: 3px; font: 700 12px var(--f-cond); background: var(--gold); color: #1b1503; padding: 0 5px; border-radius: 6px; }
.unowned { filter: grayscale(1) brightness(.45); }
.newtag { position: absolute; right: -4px; top: -6px; z-index: 3; font: 800 11px var(--f-cond); letter-spacing: .03em; background: linear-gradient(135deg, #ff4d6d, #ff9f1c); color: #fff; padding: 1px 6px; border-radius: 999px; box-shadow: 0 0 0 2px #0c1828, 0 0 10px #ff4d6d99; animation: newpulse 1.6s ease-in-out infinite; pointer-events: none; }
.newtag.inline { position: static; display: inline-block; animation: none; }
.tradecols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .tradecols { grid-template-columns: 1fr; } }
.tradebox { background: var(--panel2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.tradebox .offer { display: flex; flex-wrap: wrap; gap: 8px; --cw: 70px; }
.tradesum { margin-top: 10px; font-weight: 700; } .tradesum.good, .good { color: #6fdc8c; } .tradesum.bad { color: #ff8a7a; }
.roomcode { font: 700 22px var(--f-display); letter-spacing: .12em; color: var(--gold); }
@keyframes newpulse { 50% { transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .newtag { animation: none; } }
/* ---- zoom ---- */
#zoom { position: fixed; z-index: 90; pointer-events: none; display: flex; gap: 10px; background: rgba(9,16,28,.96); border: 1px solid var(--gold2); border-radius: 12px; padding: 10px; max-width: min(720px, 96vw); box-shadow: 0 10px 40px rgba(0,0,0,.7); }
#zoom .card { --cw: min(260px, 40vw); }
#zoom .txt { width: 340px; max-width: 46vw; font-size: 13.5px; line-height: 1.38; overflow: hidden; }
#zoom .txt h3 { font-family: var(--f-cond); font-size: 22px; color: var(--gold); }
#zoom .txt .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
#zoom .atk { border-top: 1px solid var(--line); padding: 6px 0; }
#zoom .atk b { font-family: var(--f-cond); font-size: 16px; }
#zoom .atk .dm { float: right; font: 700 18px var(--f-cond); color: var(--gold); }
#zoom .pw { background: #3a1d1d; border-left: 3px solid var(--red); padding: 5px 7px; margin: 5px 0; border-radius: 4px; }
#zoom .foot { display: flex; gap: 12px; color: var(--muted); font-size: 12.5px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; flex-wrap: wrap; align-items: center; }
#zoom .live { margin-top: 6px; padding: 6px; border-radius: 6px; background: #13253d; font-size: 12.5px; }
.ei { width: 16px; height: 16px; vertical-align: -3px; display: inline-block; background-size: contain; }
/* ---- mapa ---- */
#map { position: relative; width: min(100%, 980px); aspect-ratio: 16/10; margin: 0 auto; border-radius: 14px; overflow: hidden; border: 3px solid #0a1422; background: #2c78b8; }
#map svg.land { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; background: none; border: none; padding: 0; }
.node .dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; background: var(--red); box-shadow: 0 2px 6px rgba(0,0,0,.5); display: grid; place-items: center; font: 700 12px var(--f-cond); color: #fff; }
.node.gym .dot { width: 40px; height: 40px; border-radius: 9px; background: #6b4ec9; }
.node.done .dot { background: var(--green); }
.node.lock { opacity: .5; cursor: not-allowed; }
.node .lbl { font: 700 12px var(--f-cond); background: rgba(10,20,34,.85); padding: 1px 6px; border-radius: 6px; white-space: nowrap; color: var(--ink); }
@media (max-width: 600px) { .node .lbl { display: none; } .node.gym .lbl { display: block; font-size: 10px; } .node .dot { width: 20px; height: 20px; font-size: 9px; border-width: 2px; } .node.gym .dot { width: 26px; height: 26px; } }
.node.rocket .dot, .node.rocketonly .dot { background: #1c1c1c; border-color: #e23b3b; color: #ff4b4b; font-family: var(--f-display); }
.node.rocketonly.done .dot { background: var(--green); border-color: #fff; color: #fff; }
.rocket-head { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rbadge { width: 26px; height: 26px; border-radius: 50%; background: #111; border: 2px solid #e23b3b; color: #ff4b4b; display: grid; place-items: center; font: 400 14px var(--f-display); }
.opp-row.rk { background: linear-gradient(90deg, #2b1418, var(--panel2)); border: 1px solid #5a2020; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.hub { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; max-width: 1340px; margin: 0 auto; }
@media (max-width: 900px) { .hub { grid-template-columns: 1fr; } }
.opp-row { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; background: var(--panel2); margin-top: 8px; }
.opp-row .card { --cw: 52px; }
.opp-row .info { flex: 1; min-width: 0; }
.lv { font: 700 12px var(--f-cond); background: var(--blue); padding: 1px 6px; border-radius: 5px; }
/* ---- tienda / sobres ---- */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; max-width: 1340px; margin: 0 auto; }
.set-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.set-card .box { aspect-ratio: 480/276; background-size: cover; background-position: center; }
.set-card .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.set-card.locked .box { filter: grayscale(1) brightness(.4); }
.set-card .row { display: flex; gap: 6px; flex-wrap: wrap; }
.sym { height: 18px; vertical-align: -3px; }
.packs-own { display: flex; gap: 10px; flex-wrap: wrap; }
.pack { width: 96px; aspect-ratio: 166/268; background-size: cover; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.6); position: relative; cursor: pointer; transition: transform .15s; border: none; padding: 0; }
.pack:hover { transform: translateY(-4px) rotate(-1deg); }
.pack .n { position: absolute; right: -6px; top: -6px; background: var(--red); color: #fff; font: 700 13px var(--f-cond); border-radius: 10px; padding: 1px 7px; }
#opening { position: fixed; inset: 0; z-index: 80; background: radial-gradient(circle at 50% 40%, #1f3d66, #050a12 75%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
#opening .bigpack { width: 220px; aspect-ratio: 166/268; background-size: cover; border-radius: 10px; box-shadow: 0 0 40px rgba(242,194,48,.35); cursor: pointer; animation: bob 1.6s ease-in-out infinite; border: none; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(1deg); } }
#opening .tear { animation: tear .5s forwards; }
@keyframes tear { to { transform: scale(1.3) rotate(-8deg); opacity: 0; } }
.fan { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 1100px; padding: 0 16px; }
.flip { width: 120px; aspect-ratio: 5/6.875; perspective: 800px; cursor: pointer; background: none; border: none; padding: 0; }
.flip .in { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.flip.up .in { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 6px; }
.flip .face.front { transform: rotateY(180deg); }
.flip .face .card { --cw: 120px; }
.flip.rare-glow .face.back { box-shadow: 0 0 18px 4px rgba(242,194,48,.8); }
.flip.holo-glow .face.back { box-shadow: 0 0 22px 6px rgba(140,220,255,.9); }
/* ---- colección / mazos ---- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--cw) + 6px), 1fr)); gap: 8px; }
.grid .card { --cw: 96px; cursor: pointer; }
.deckwrap { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 14px; height: 100%; }
@media (max-width: 900px) { .deckwrap { grid-template-columns: 1fr; } }
.decklist { overflow: auto; }
.dl-row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; font-size: 13.5px; }
.dl-row:hover { background: var(--panel2); }
.dl-row .q { font: 700 15px var(--f-cond); width: 22px; text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
.dl-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dl-row button { padding: 0 8px; font-size: 15px; line-height: 20px; }
.ok { color: var(--green); } .bad { color: var(--red); }
/* ---- batalla ---- */
#battle { background: var(--felt2); }
#bwrap { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 290px; min-height: 0; }
@media (max-width: 900px) { #bwrap { grid-template-columns: 1fr; } #side { display: none; } }
#board { position: relative; display: grid; grid-template-rows: minmax(0,1fr) auto minmax(0,1fr) auto; min-height: 0; height: 100%; overflow: hidden; }
#battle #bwrap { height: 100%; }
.half { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; padding: 6px 14px; min-height: 0; background: linear-gradient(rgba(16,32,54,.80), rgba(16,32,54,.80)), url(assets/mat.webp) center/cover; }
.half.opp { background: linear-gradient(rgba(42,16,18,.82), rgba(30,12,16,.86)), url(assets/mat.webp) center/cover; }
.center-col { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.half.opp .center-col { flex-direction: column-reverse; }
.bench { display: flex; gap: 8px; justify-content: center; min-height: calc(var(--cw) * 1.375 + 20px); flex-wrap: nowrap; }
.prizes { display: grid; grid-template-columns: repeat(2, calc(var(--cw) * .5)); gap: 4px; align-content: center; }
.prizes .card { --cw: calc(clamp(50px, min(5.6vw, 8.4vh), 104px) * .5); }
.piles { display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; }
.pile { position: relative; cursor: pointer; background: none; border: none; padding: 0; }
.pile .lab { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); font: 700 12px var(--f-cond); background: rgba(0,0,0,.75); padding: 0 6px; border-radius: 5px; white-space: nowrap; }
.pile.empty { width: var(--cw); height: calc(var(--cw) * 1.375); border: 2px dashed #3a5478; border-radius: 6px; }
.slot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; transition: transform .15s; background: none; border: none; padding: 0; color: inherit; }
.slot .card { transition: transform .25s; }
.slot.active-slot .card { --cw: calc(clamp(50px, min(5.6vw, 8.4vh), 104px) * 1.12); }
.slot.st-asleep .card { transform: rotate(-90deg) scale(.82); }
.slot.st-paralyzed .card { transform: rotate(90deg) scale(.82); }
.slot.st-confused .card { transform: rotate(180deg); }
.slot .ener { display: flex; gap: 1px; flex-wrap: wrap; justify-content: center; max-width: calc(var(--cw) * 1.2); min-height: 16px; }
.slot .dmg { position: absolute; top: -6px; right: -10px; width: 38px; height: 38px; background-image: url(assets/damage.webp); background-size: 800% 500%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.7)); z-index: 2; }
.slot .stt { position: absolute; top: 18%; left: -12px; display: flex; flex-direction: column; gap: 2px; z-index: 2; }
.slot .stt span { font: 700 11px var(--f-cond); padding: 1px 5px; border-radius: 5px; }
.slot .stt img { width: 26px; height: 26px; }
.slot .stt .st-tag-burned { background: #c2410c; color: #fff; }
#map.orange { background: radial-gradient(ellipse at 40% 30%, #4cc3e0, #1f86b5 70%, #176b96); }
.st-tag-asleep { background: #5a6bd8; } .st-tag-confused { background: #c64fc9; } .st-tag-paralyzed { background: #d8b321; color: #000; }
